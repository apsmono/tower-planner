<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ticket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="glow-ticket" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#glow-ticket)">
    <!-- Ticket base with notched cutouts -->
    <path d="M8,16 C8,16 12,16 12,20 C12,24 8,24 8,24 L8,40 C8,40 12,40 12,44 C12,48 8,48 8,48 L56,48 C56,48 52,48 52,44 C52,40 56,40 56,40 L56,24 C56,24 52,24 52,20 C52,16 56,16 56,16 Z" fill="url(#ticket-grad)" stroke="#fde68a" stroke-width="2"/>
    <!-- Perforation dashed line -->
    <line x1="24" y1="18" x2="24" y2="46" stroke="#78350f" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Star icon -->
    <polygon points="40,24 42.5,31 49.5,31 44,35.5 46,42.5 40,38 34,42.5 36,35.5 30.5,31 37.5,31" fill="#fef3c7"/>
  </g>
</svg>
