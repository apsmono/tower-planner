<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="reroll-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <filter id="glow-reroll" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#glow-reroll)">
    <!-- Pointed diamond shard -->
    <polygon points="32,4 54,26 32,60 10,26" fill="url(#reroll-grad)" stroke="#e9d5ff" stroke-width="2"/>
    <polygon points="32,4 32,60 10,26" fill="#7e22ce" fill-opacity="0.4"/>
    <polygon points="32,4 54,26 32,32" fill="#e9d5ff" fill-opacity="0.6"/>
    <polygon points="10,26 32,32 32,60" fill="#6b21a8" fill-opacity="0.3"/>
    <polygon points="54,26 32,60 32,32" fill="#581c87" fill-opacity="0.8"/>
  </g>
</svg>
