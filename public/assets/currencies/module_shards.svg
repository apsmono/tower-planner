<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mod-shard-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="glow-mod-shard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22c55e" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#glow-mod-shard)">
    <!-- Hexagonal crystal prism -->
    <polygon points="32,4 52,18 52,46 32,60 12,46 12,18" fill="url(#mod-shard-grad)" stroke="#86efac" stroke-width="2"/>
    <polygon points="32,4 32,60 12,46 12,18" fill="#15803d" fill-opacity="0.4"/>
    <polygon points="32,4 52,18 32,32" fill="#86efac" fill-opacity="0.6"/>
    <polygon points="12,18 32,32 12,46" fill="#166534" fill-opacity="0.3"/>
    <polygon points="52,18 52,46 32,32" fill="#22c55e" fill-opacity="0.5"/>
    <polygon points="32,32 52,46 32,60" fill="#14532d" fill-opacity="0.8"/>
  </g>
</svg>
