<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="key-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4466"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow-key-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#glow-key-red)">
    <!-- Angular Sci-fi Key Head (Hexagonal/Tech Ring) -->
    <polygon points="20,10 32,10 38,20 32,30 20,30 14,20" fill="url(#key-red-grad)" stroke="#fda4af" stroke-width="1.5"/>
    
    <!-- Inner Core Cutout -->
    <polygon points="22,15 30,15 34,20 30,25 22,25 18,20" fill="#2a080c" stroke="#ff2a55" stroke-width="1.2"/>
    <circle cx="26" cy="20" r="2.5" fill="#ff6b8b"/>

    <!-- Key Shaft -->
    <rect x="33" y="18" width="22" height="4" rx="1" fill="url(#key-red-grad)" stroke="#fda4af" stroke-width="1"/>
    
    <!-- Modern Tech Teeth / Bits -->
    <path d="M44,22 L44,29 L48,29 L48,22 Z" fill="url(#key-red-grad)" stroke="#fda4af" stroke-width="1"/>
    <path d="M51,22 L51,32 L55,32 L55,22 Z" fill="url(#key-red-grad)" stroke="#fda4af" stroke-width="1"/>
    
    <!-- Cyber Accent notches on top -->
    <path d="M40,18 L40,15 L43,15 L43,18 Z" fill="#ff4466"/>
    <line x1="34" y1="20" x2="54" y2="20" stroke="#fff" stroke-width="0.8" opacity="0.75"/>
  </g>
</svg>
