<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Rainbow glow filters -->
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="100" height="100" fill="#000"/>

  <!-- Outer hexagon: Red-Orange neon -->
  <!-- Hexagon points at flat-top orientation, center 50,50, radius 44 -->
  <polygon
    points="50,6 88,28 88,72 50,94 12,72 12,28"
    fill="none"
    stroke="#ff3300"
    stroke-width="2.5"
    filter="url(#glow-red)"
    opacity="0.95"
  />
  <!-- Extra glow layer -->
  <polygon
    points="50,6 88,28 88,72 50,94 12,72 12,28"
    fill="none"
    stroke="#ff6600"
    stroke-width="1"
    opacity="0.7"
  />

  <!-- Middle hexagon: Green-Cyan neon, radius 30 -->
  <polygon
    points="50,20 76,35 76,65 50,80 24,65 24,35"
    fill="none"
    stroke="#00ff88"
    stroke-width="2.2"
    filter="url(#glow-green)"
    opacity="0.95"
  />
  <polygon
    points="50,20 76,35 76,65 50,80 24,65 24,35"
    fill="none"
    stroke="#00ffcc"
    stroke-width="1"
    opacity="0.6"
  />

  <!-- Inner hexagon: Blue-Violet neon, radius 17 -->
  <polygon
    points="50,33 64.7,41.5 64.7,58.5 50,67 35.3,58.5 35.3,41.5"
    fill="none"
    stroke="#8800ff"
    stroke-width="2"
    filter="url(#glow-violet)"
    opacity="0.95"
  />
  <polygon
    points="50,33 64.7,41.5 64.7,58.5 50,67 35.3,58.5 35.3,41.5"
    fill="none"
    stroke="#cc44ff"
    stroke-width="1"
    opacity="0.7"
  />

  <!-- Spike rays at outer hexagon corners: top -->
  <line x1="50" y1="6" x2="50" y2="-4" stroke="#ff4400" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-red)" opacity="0.9"/>
  <!-- top-right -->
  <line x1="88" y1="28" x2="96" y2="23" stroke="#ffaa00" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-orange)" opacity="0.9"/>
  <!-- bottom-right -->
  <line x1="88" y1="72" x2="96" y2="77" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-green)" opacity="0.9"/>
  <!-- bottom -->
  <line x1="50" y1="94" x2="50" y2="104" stroke="#00ccff" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-cyan)" opacity="0.9"/>
  <!-- bottom-left -->
  <line x1="12" y1="72" x2="4" y2="77" stroke="#4400ff" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-violet)" opacity="0.9"/>
  <!-- top-left -->
  <line x1="12" y1="28" x2="4" y2="23" stroke="#aa00ff" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-violet)" opacity="0.9"/>

  <!-- Extra ambient glow dots at corners -->
  <circle cx="50" cy="6" r="2.5" fill="#ff4400" opacity="0.8" filter="url(#glow-red)"/>
  <circle cx="88" cy="28" r="2.5" fill="#ffaa00" opacity="0.8" filter="url(#glow-orange)"/>
  <circle cx="88" cy="72" r="2.5" fill="#00ff88" opacity="0.8" filter="url(#glow-green)"/>
  <circle cx="50" cy="94" r="2.5" fill="#00ccff" opacity="0.8" filter="url(#glow-cyan)"/>
  <circle cx="12" cy="72" r="2.5" fill="#4400ff" opacity="0.8" filter="url(#glow-violet)"/>
  <circle cx="12" cy="28" r="2.5" fill="#aa00ff" opacity="0.8" filter="url(#glow-violet)"/>
</svg>